[project]
name = "sr-bot2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0,<4",
    "alembic>=1.20.1,<2",
    "asyncpg>=0.32.0",
    "faster-whisper>=1.2.1,<2",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
]

[dependency-groups]
dev = [
    "groq>=1.7.0,<2",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
# We don't use av ourselves; faster-whisper does. faster-whisper 1.2.1 calls
# av.open(metadata_errors=...), which av 19 removed (Step 1.6 D7 A).
# Remove this line when a faster-whisper release works with av 19.
constraint-dependencies = ["av<19"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep ruff's default rules and add: I = import order, UP = modern Python syntax, B = common bugs
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not installed as a package, so tell pytest where to find `app`
pythonpath = ["."]
